format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: other

meta:
  bitrise.io:
    stack: osx-xcode-26.6.x

app:
  envs:
    - MIXLINK_BUNDLE_ID: com.mixlink.app
    - MIXLINK_TEAM_ID: HTM265HZW7
    - BAZEL_CACHE_DIR: /Users/Shared/mixlink-bazel-cache
    - MIXLINK_BUILD_CONFIGURATION: release_arm64

workflows:
  preflight:
    description: Validate the MixLink Bazel/Xcode build without compiling the app.
    steps:
      - git-clone@8: {}
      - script@1:
          title: Run build preflight
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                ./scripts/xcode-cloud/ci_preflight.sh

  build:
    description: Build an unsigned MixLink IPA for CI validation.
    steps:
      - git-clone@8: {}
      - restore-cache@2:
          inputs:
            - key: mixlink-bazel-{{ .Branch }}-{{ checksum "MODULE.bazel" }}
            - fallback_keys: |
                mixlink-bazel-{{ .Branch }}-
                mixlink-bazel-main-
      - script@1:
          title: Build MixLink with Bazel
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail

                cd "$BITRISE_SOURCE_DIR"
                mkdir -p "$BAZEL_CACHE_DIR"

                BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
                COMMIT_COUNT="$(git rev-list --count HEAD)"
                BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
                mkdir -p build/artifacts

                python3 -u build-system/Make/Make.py \
                  --cacheDir="$BAZEL_CACHE_DIR" \
                  build \
                  --configurationPath="build-system/template_minimal_development_configuration.json" \
                  --xcodeManagedCodesigning \
                  --disableProvisioningProfiles \
                  --disableExtensions \
                  --configuration="$MIXLINK_BUILD_CONFIGURATION" \
                  --buildNumber="$BUILD_NUMBER" \
                  --outputBuildArtifactsPath="$BITRISE_DEPLOY_DIR"

      - deploy-to-bitrise-io@2: {}
      - save-cache@1:
          inputs:
            - key: mixlink-bazel-{{ .Branch }}-{{ checksum "MODULE.bazel" }}
            - cache_paths: |
                /Users/Shared/mixlink-bazel-cache

  release:
    description: Signed App Store/TestFlight build using the encrypted Match repository.
    steps:
      - git-clone@8: {}
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - restore-cache@2:
          inputs:
            - key: mixlink-bazel-{{ .Branch }}-{{ checksum "MODULE.bazel" }}
            - fallback_keys: |
                mixlink-bazel-{{ .Branch }}-
                mixlink-bazel-main-
      - script@1:
          title: Build signed MixLink IPA with Bazel
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail

                cd "$BITRISE_SOURCE_DIR"
                mkdir -p "$BAZEL_CACHE_DIR" "$BITRISE_DEPLOY_DIR"

                BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
                COMMIT_COUNT="$(git rev-list --count HEAD)"
                BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

                python3 -u build-system/Make/Make.py \
                  --cacheDir="$BAZEL_CACHE_DIR" \
                  build \
                  --configurationPath="build-system/appstore-configuration.json" \
                  --gitCodesigningRepository="git@github.com:alcaideaubrianna-pixel/mixlink-signing.git" \
                  --gitCodesigningType=appstore \
                  --configuration="$MIXLINK_BUILD_CONFIGURATION" \
                  --buildNumber="$BUILD_NUMBER" \
                  --outputBuildArtifactsPath="$BITRISE_DEPLOY_DIR"

                IPA_PATH="$(find "$BITRISE_DEPLOY_DIR" -maxdepth 2 -type f -name '*.ipa' -print -quit)"
                test -n "$IPA_PATH"
                envman add --key BITRISE_IPA_PATH --value "$IPA_PATH"
                echo "IPA prepared for upload: $(basename "$IPA_PATH")"

      - script@1:
          title: Prepare App Store Connect API key
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail

                test -n "${MIXLINK_ASC_PRIVATE_KEY_BASE64:-}"
                API_KEY_PATH="$BITRISE_SOURCE_DIR/build/AuthKey_9J6A6YKJ7C.p8"
                mkdir -p "$(dirname "$API_KEY_PATH")"
                if [[ "$MIXLINK_ASC_PRIVATE_KEY_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
                  printf '%s\n' "$MIXLINK_ASC_PRIVATE_KEY_BASE64" > "$API_KEY_PATH"
                else
                  printf '%s' "$MIXLINK_ASC_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | base64 -D > "$API_KEY_PATH"
                fi
                chmod 600 "$API_KEY_PATH"
                openssl pkey -in "$API_KEY_PATH" -noout >/dev/null
                envman add --key MIXLINK_ASC_API_KEY_URL --value "file://$API_KEY_PATH"

      - deploy-to-itunesconnect-application-loader@2:
          inputs:
            - connection: "off"
            - api_key_path: "$MIXLINK_ASC_API_KEY_URL"
            - api_issuer: "85c346bd-f59d-4a4a-92a8-6de6d9c26d3b"
            - app_id: "6815920240"
            - bundle_id: "$MIXLINK_BUNDLE_ID"
            - ipa_path: "$BITRISE_IPA_PATH"
            - platform: ios
      - deploy-to-bitrise-io@2: {}
      - save-cache@1:
          inputs:
            - key: mixlink-bazel-{{ .Branch }}-{{ checksum "MODULE.bazel" }}
            - cache_paths: |
                /Users/Shared/mixlink-bazel-cache
